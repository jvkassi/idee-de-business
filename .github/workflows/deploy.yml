name: Deploy to Vercel

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --global vercel@latest

      # Build distant (pas de `vercel pull` + `vercel build` local) : les
      # variables marquées "Secret" côté Vercel ne peuvent pas être
      # rapatriées en clair sur le runner CI (elles reviennent en
      # "[SENSITIVE]", ce qui casse tout code qui valide leur format au
      # chargement, comme les clés VAPID). Un build distant s'exécute sur
      # l'infra Vercel elle-même, qui a un accès normal aux vraies valeurs.
      - name: Déployer sur Vercel (build distant)
        run: vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
