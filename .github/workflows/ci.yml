name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run test

      - run: bun run build
        env:
          # Aucune base de données n'est requise au build : toutes les pages
          # sont en rendu dynamique (force-dynamic), les requêtes SQL ne
          # s'exécutent qu'à la requête, jamais pendant `next build`.
          GEMINI_API_KEY: dummy-build-time-key
          SESSION_SECRET: dummy-build-time-secret
